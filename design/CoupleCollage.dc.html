<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&family=Alex+Brush&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Jost',sans-serif;color:#3d332a;background:linear-gradient(180deg,#f8eeee,#f3e2e0);}
  .serif{font-family:'Cormorant Garamond',Georgia,serif;}
  .script{font-family:'Alex Brush',cursive;}
  .thumb{border-radius:4px;}
</style>
</helmet>

<div style="width:1440px;padding:56px 64px 64px;">

  <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:28px;">
    <div style="font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#a8706f;">Wedding &middot; Featured Couple</div>
  </div>

  <div style="position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:200px;gap:16px;">

    <!-- Row 1 -->
    <div class="thumb" style="grid-column:1/2;grid-row:1/2;background:linear-gradient(135deg,#f0dcdc,#dcaaa8);"></div>
    <div class="thumb" style="grid-column:2/4;grid-row:1/2;background:linear-gradient(135deg,#e9c9c8,#c98f8a);"></div>

    <!-- Film tile, spans rows 1-2, right column -->
    <div style="grid-column:4/5;grid-row:1/3;position:relative;border-radius:4px;overflow:hidden;background:linear-gradient(160deg,#3d332a,#6b5c4c);">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
        <div style="width:60px;height:60px;border-radius:999px;background:rgba(255,250,241,0.92);display:flex;align-items:center;justify-content:center;">
          <div style="width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #3d332a;margin-left:4px;"></div>
        </div>
      </div>
      <div style="position:absolute;bottom:0;inset-inline:0;padding:10px 14px;background:linear-gradient(0deg,rgba(0,0,0,0.55),transparent);color:#f4e9d9;font-size:11px;letter-spacing:.06em;">First Dance</div>
    </div>

    <!-- Row 2 -->
    <div class="thumb" style="grid-column:1/2;grid-row:2/3;background:linear-gradient(135deg,#f3e0df,#d3a09d);"></div>

    <!-- Text cell: couple names -->
    <div style="grid-column:2/4;grid-row:2/3;position:relative;border-radius:4px;background:#fdf6f3;border:1px solid #f0dcdc;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;">
      <svg width="18" height="16" viewBox="0 0 24 22" style="position:absolute;top:14px;right:18px;opacity:.55;" fill="none" stroke="#b98b4e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20 C4 14 1 9 1 5.8 C1 2.6 3.3 1 5.8 1 C8 1 10 2.3 12 5 C14 2.3 16 1 18.2 1 C20.7 1 23 2.6 23 5.8 C23 9 20 14 12 20 Z"/>
      </svg>
      <div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#a8706f;margin-bottom:6px;">Our Love Story</div>
      <div class="script" style="font-size:44px;line-height:1;color:#8f6a34;">Priya &amp; Arjun</div>
    </div>

    <!-- Row 3 -->
    <div class="thumb" style="grid-column:1/3;grid-row:3/4;background:linear-gradient(135deg,#ecd2d1,#c68885);"></div>
    <div class="thumb" style="grid-column:3/4;grid-row:3/5;background:linear-gradient(135deg,#e7c9b8,#c98f8a);"></div>
    <div class="thumb" style="grid-column:4/5;grid-row:3/4;background:linear-gradient(135deg,#f0dcdc,#dcaaa8);"></div>

    <!-- Row 4 -->
    <div style="grid-column:1/2;grid-row:4/5;position:relative;">
      <div class="thumb" style="position:absolute;inset:0;background:linear-gradient(135deg,#e9c9c8,#c98f8a);"></div>
      <svg width="20" height="18" viewBox="0 0 24 22" style="position:absolute;bottom:10px;left:10px;" fill="none" stroke="#fffaf1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
        <path d="M12 20 C4 14 1 9 1 5.8 C1 2.6 3.3 1 5.8 1 C8 1 10 2.3 12 5 C14 2.3 16 1 18.2 1 C20.7 1 23 2.6 23 5.8 C23 9 20 14 12 20 Z"/>
      </svg>
    </div>
    <div class="thumb" style="grid-column:2/3;grid-row:4/5;background:linear-gradient(135deg,#f3e0df,#d3a09d);"></div>
    <div class="thumb" style="grid-column:4/5;grid-row:4/5;background:linear-gradient(135deg,#ecd2d1,#c68885);"></div>

  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
